# Render free web service for Sardar And Malik Store.
# Render free tier: no credit card; free web services spin down after
# 15 minutes without traffic and take ~1 minute to wake; 750 free instance
# hours per workspace per month. Free Postgres expires 30 days after
# creation (deleted 14 days later) — before that, move DATABASE_URL to a
# free Neon Postgres (no expiry). The public URL never changes when the
# database moves. No persistent disk on the free tier, so the local SQLite
# file is only a fallback; on Render the store always uses DATABASE_URL.
services:
  - type: web
    name: sardar-and-malik-store
    env: node
    plan: free
    buildCommand: npm install && tar -xzf public/photos-part1.tar.gz -C public/photos/ && tar -xzf public/photos-part2.tar.gz -C public/photos/
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: PANEL_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sardar-store-db
          property: connectionString
databases:
  - name: sardar-store-db
    plan: free
